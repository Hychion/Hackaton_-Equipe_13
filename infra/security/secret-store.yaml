# Store de secrets contrôlé + accès en lecture seule pour ESO (chantier D).
# Le secret source `chain-secrets` vit dans le namespace secret-store, créé
# HORS GIT via scripts/bootstrap-secrets.sh. ESO le lit avec un ServiceAccount
# à RBAC minimal (get/list secrets dans ce seul namespace) et le projette
# ailleurs. En prod : remplacer le provider kubernetes par OVH/Vault/cloud KMS.
apiVersion: v1
kind: Namespace
metadata:
  name: secret-store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-reader
  namespace: secret-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-reader
  namespace: secret-store
subjects:
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: secret-store
roleRef:
  kind: Role
  name: eso-store-reader
  apiGroup: rbac.authorization.k8s.io
---
# Store cluster-wide : provider kubernetes pointant sur secret-store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-store
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secret-store
      auth:
        serviceAccount:
          name: eso-store-reader
          namespace: secret-store
