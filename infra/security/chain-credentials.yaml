# Namespace du remediator + ExternalSecret qui matérialise ses credentials.
# ESO lit chain-secrets (dans secret-store) et crée le Secret chain-credentials
# ici. Ce fichier ne contient AUCUNE valeur secrète — que des références.
apiVersion: v1
kind: Namespace
metadata:
  name: remediator
  labels:
    # PSA ENFORCE : nos propres composants sont conformes 'restricted'
    # (non-root, drop ALL, seccomp RuntimeDefault) → on impose la norme chez nous.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chain-credentials
  namespace: remediator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-store
  target:
    name: chain-credentials
    creationPolicy: Owner
  data:
    - secretKey: github-token
      remoteRef:
        key: chain-secrets
        property: github-token
    - secretKey: ovh-ai-token
      remoteRef:
        key: chain-secrets
        property: ovh-ai-token
