# Kyverno — policy-as-code. Graduated CNCF.
# Le moteur ; les ClusterPolicies (prévention de récidive) sont dans
# platform/kyverno/policies via l'Application kyverno-policies.
apiVersion: argoproj.io/v1alpha1
metadata:
  name: kyverno
  namespace: argocd
kind: Application
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
