# Kyverno — policy-as-code. Graduated CNCF.
# Le moteur ; les ClusterPolicies (prévention de récidive) sont dans
# platform/kyverno/policies via l'Application kyverno-policies.
apiVersion: argoproj.io/v1alpha1
metadata:
  name: kyverno
  namespace: argocd
kind: Application
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |
        # Les CRD Kyverno sont volumineuses (>1 Mo). L'apply client-side d'Argo
        # ajoute un last-applied-configuration qui dépasse la limite d'annotation
        # (256 Ko). On annote donc chaque CRD pour qu'Argo utilise `kubectl replace`
        # (create/replace sans last-applied) → fix reproductible depuis Git.
        crds:
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRD Kyverno volumineuses : évite l'erreur "annotations too long" (apply client-side)
