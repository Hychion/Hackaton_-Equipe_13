# Velero (CNCF) — sauvegarde/restauration des ressources K8s + PV vers S3 (Garage).
# Sauvegarde ce que Git ne couvre pas (état runtime, PV, données). Complète le
# PRA GitOps. Endpoint S3 swappable (Garage in-cluster / cluster Garage externe /
# tout S3-compatible) — juste l'URL à changer, zéro vendor lock-in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: hackathon
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.1.0
    helm:
      values: |
        # Plugin S3 (AWS-compatible) chargé au démarrage
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.12.1
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        credentials:
          useSecret: true
          existingSecret: cloud-credentials   # créé hors Git (bootstrap-backup.sh)
        configuration:
          # Backup de PV par copie fichier (kopia) → pas besoin de CSI snapshots
          uploaderType: kopia
          # 2 cibles : OVH Object Storage (off-site souverain, primaire démo) +
          # Garage in-cluster (S3 open source local / air-gap). Même API S3,
          # credentials distincts par BSL. OVH = clés hors Git (ovh-credentials).
          backupStorageLocation:
            - name: ovh
              provider: aws
              bucket: velero-equipe13
              default: true
              credential:
                name: ovh-credentials
                key: cloud
              config:
                region: gra
                s3Url: https://s3.gra.cloud.ovh.net
                s3ForcePathStyle: "true"
            - name: garage
              provider: aws
              bucket: velero
              credential:
                name: cloud-credentials
                key: cloud
              config:
                region: garage
                s3Url: http://garage.backup-store.svc.cluster.local:3900
                s3ForcePathStyle: "true"
          volumeSnapshotLocation: []
        snapshotsEnabled: false
        deployNodeAgent: true        # agent kopia sur chaque nœud (backup PV)
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
