# Falco — détection de menaces au runtime (syscalls). Graduated CNCF.
# Utilise le driver modern-bpf (pas de module kernel à compiler).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: hackathon
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.1.0
    helm:
      values: |
        # Règle custom fiable pour la démo (les règles classiques sont en
        # maturity 'incubating' et non chargées par défaut en Falco 0.44).
        # Ciblée sur le namespace demo → aucun faux positif (nginx ne lance
        # jamais id/whoami). Priorité WARNING → passe le seuil du responder.
        customRules:
          demo-rules.yaml: |-
            - rule: Reconnaissance dans le conteneur demo
              desc: Un binaire de reconnaissance a ete lance dans le workload de demo
              condition: >
                spawned_process and container and k8s.ns.name = "demo"
                and proc.name in (whoami, id, uname, hostname, netstat)
              output: >
                Commande de reconnaissance dans un conteneur
                (command=%proc.cmdline user=%user.name container=%container.name
                image=%container.image.repository pod=%k8s.pod.name ns=%k8s.ns.name)
              priority: WARNING
              tags: [demo, recon, mitre_discovery]
        driver:
          kind: modern_ebpf
        falco:
          json_output: true
          json_include_output_property: true
        # Expose les événements en métriques + sortie stdout pour la démo
        # Métriques Falco natives → Prometheus
        metrics:
          enabled: true
          service:
            create: true
        falcosidekick:
          enabled: true
          webui:
            enabled: true
          # Métriques falcosidekick (events par priorité, outputs) → Prometheus
          serviceMonitor:
            enabled: true
          # (B) Envoie chaque alerte >= warning à notre responder IA.
          config:
            webhook:
              address: "http://falco-ai-responder.falco-responder.svc.cluster.local:8080/"
              minimumpriority: "warning"
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
