# Trivy Operator — scanne images & configs, produit des CRD VulnerabilityReport
# et ConfigAuditReport que le remediator IA consomme.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.33.2
    helm:
      values: |
        trivy:
          # Scanner en mode standalone, ignore les images non résolues
          ignoreUnfixed: true
        operator:
          scannerReportTTL: ""            # garder les rapports pour la démo
          configAuditScannerEnabled: true
          vulnerabilityScannerEnabled: true
          # Rescan rapide pour une démo réactive
          scanJobsConcurrentLimit: 3
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
