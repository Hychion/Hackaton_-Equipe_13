# Trivy Operator — scanne images & configs, produit des CRD VulnerabilityReport
# et ConfigAuditReport que le remediator IA consomme.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
spec:
  project: hackathon
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.33.2
    helm:
      values: |
        trivy:
          # Scanner en mode standalone, ignore les images non résolues
          ignoreUnfixed: true
        operator:
          # SCAN PLANIFIÉ (indépendant de tout déploiement/pipeline) : au bout de
          # ce délai le rapport expire → trivy-operator RE-SCANNE automatiquement.
          # Capte les CVE nouvellement publiées sur des images inchangées.
          # X = 7 jours (168h). Ajustable : "24h" (quotidien), "72h"…
          scannerReportTTL: "168h"
          configAuditScannerEnabled: true
          vulnerabilityScannerEnabled: true
          # (A-bis) Métrique détaillée PAR CVE (trivy_vulnerability_id) pour le
          #         tableau Grafana listant chaque CVE (id, sévérité, package…).
          #         Cardinalité + élevée mais acceptable sur ce cluster de démo.
          metricsVulnIdEnabled: true
          # (C) SBOM CycloneDX → CRD sbomreports : inventaire des composants
          #     (angle Cyber Resilience Act / supply chain)
          sbomGenerationEnabled: true
          # Rescan rapide pour une démo réactive
          scanJobsConcurrentLimit: 3
        # (A) Expose les métriques Prometheus (trivy_image_vulnerabilities…)
        #     → scrapées par kube-prometheus-stack → courbe de CVE dans Grafana
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
