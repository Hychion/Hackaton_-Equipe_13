# kube-prometheus-stack — Prometheus + Grafana + Alertmanager. Graduated CNCF.
# Sert de tableau de bord : nombre de vulnérabilités dans le temps (via
# les métriques exportées par trivy-operator) + événements Falco.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1
    helm:
      values: |
        grafana:
          adminPassword: hackathon-ovh
          service:
            type: LoadBalancer
        prometheus:
          prometheusSpec:
            # Scrape aussi les ServiceMonitors hors du chart (trivy, falco)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
