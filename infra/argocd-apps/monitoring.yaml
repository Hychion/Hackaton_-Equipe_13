# kube-prometheus-stack — Prometheus + Grafana + Alertmanager. Graduated CNCF.
# Sert de tableau de bord : nombre de vulnérabilités dans le temps (via
# les métriques exportées par trivy-operator) + événements Falco.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: hackathon
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1
    helm:
      values: |
        grafana:
          adminPassword: hackathon-ovh
          service:
            type: LoadBalancer
            port: 443
            targetPort: 3000
          # TLS natif Grafana (cert auto-signé, secret grafana-tls créé hors Argo).
          # Pas de domaine public => pas de Let's Encrypt, on assume le self-signed.
          grafana.ini:
            server:
              protocol: https
              cert_file: /etc/grafana-tls/tls.crt
              cert_key: /etc/grafana-tls/tls.key
          extraSecretMounts:
            - name: grafana-tls
              secretName: grafana-tls
              mountPath: /etc/grafana-tls
              readOnly: true
          # Sondes en HTTPS sinon le pod n'est jamais Ready (Grafana sert en TLS).
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
        prometheus:
          prometheusSpec:
            # Scrape aussi les ServiceMonitors hors du chart (trivy, falco)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
