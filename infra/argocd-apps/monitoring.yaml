# kube-prometheus-stack — Prometheus + Grafana + Alertmanager. Graduated CNCF.
# Sert de tableau de bord : nombre de vulnérabilités dans le temps (via
# les métriques exportées par trivy-operator) + événements Falco.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: hackathon
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1
    helm:
      values: |
        grafana:
          adminPassword: hackathon-ovh
          service:
            type: LoadBalancer
            port: 443
            targetPort: 3000
          # TLS natif Grafana (cert auto-signé, secret grafana-tls créé hors Argo).
          # Pas de domaine public => pas de Let's Encrypt, on assume le self-signed.
          grafana.ini:
            server:
              protocol: https
              cert_file: /etc/grafana-tls/tls.crt
              cert_key: /etc/grafana-tls/tls.key
              root_url: https://localhost:3000/
            # SSO OIDC via Keycloak (realm hackathon, client grafana).
            # Le groupe grafana-admins → rôle Admin (JMESPath sur le claim groups).
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              client_secret: grafana-oidc-demo-secret
              scopes: "openid email profile groups"
              auth_url: http://51.210.2.211/realms/hackathon/protocol/openid-connect/auth
              token_url: http://51.210.2.211/realms/hackathon/protocol/openid-connect/token
              api_url: http://51.210.2.211/realms/hackathon/protocol/openid-connect/userinfo
              role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
              allow_sign_up: true
              use_pkce: true
          extraSecretMounts:
            - name: grafana-tls
              secretName: grafana-tls
              mountPath: /etc/grafana-tls
              readOnly: true
          # Sondes en HTTPS sinon le pod n'est jamais Ready (Grafana sert en TLS).
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
        prometheus:
          prometheusSpec:
            # Scrape aussi les ServiceMonitors hors du chart (trivy, falco)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
