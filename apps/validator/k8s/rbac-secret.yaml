apiVersion: v1
kind: Namespace
metadata:
  name: validator
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator
  namespace: validator
---
# Lecture seule des signaux de validation en pré-prod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: validator-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: validator-reader
subjects:
  - kind: ServiceAccount
    name: validator
    namespace: validator
roleRef:
  kind: ClusterRole
  name: validator-reader
  apiGroup: rbac.authorization.k8s.io
---
# Token GitHub (pour la PR de promotion) projeté par ESO — jamais en Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chain-credentials
  namespace: validator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-store
  target:
    name: chain-credentials
    creationPolicy: Owner
  data:
    - secretKey: github-token
      remoteRef:
        key: chain-secrets
        property: github-token
