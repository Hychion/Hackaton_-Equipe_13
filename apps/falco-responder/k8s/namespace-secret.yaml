# Namespace du responder + credentials projetés par ESO (mêmes clés que le
# remediator : token GitHub + clé OVH AI). Aucune valeur secrète en Git.
apiVersion: v1
kind: Namespace
metadata:
  name: falco-responder
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chain-credentials
  namespace: falco-responder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-store
  target:
    name: chain-credentials
    creationPolicy: Owner
  data:
    - secretKey: github-token
      remoteRef:
        key: chain-secrets
        property: github-token
    - secretKey: ovh-ai-token
      remoteRef:
        key: chain-secrets
        property: ovh-ai-token
