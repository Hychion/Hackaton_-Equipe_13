# Dashboard Grafana "Gouvernance & GitOps" — couvre les briques ajoutées :
# Kyverno (policy-as-code) + Argo CD (état GitOps). Importé par le sidecar Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-governance
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  governance.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "title": "Chaîne de sécurité — Gouvernance & GitOps",
      "uid": "hackathon-governance",
      "tags": ["hackathon", "security", "kyverno", "argocd"],
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "query": "prometheus", "hide": 0, "current": {} }
        ]
      },
      "panels": [
        {
          "type": "stat", "title": "Applications Argo CD saines",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "count(argocd_app_info{health_status=\"Healthy\"})" } ]
        },
        {
          "type": "stat", "title": "Applications synchronisées (Synced)",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "count(argocd_app_info{sync_status=\"Synced\"})" } ]
        },
        {
          "type": "stat", "title": "Applications OutOfSync",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "count(argocd_app_info{sync_status=\"OutOfSync\"}) or vector(0)" } ]
        },
        {
          "type": "piechart", "title": "Résultats des policies Kyverno (pass / fail…)",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "legend": { "displayMode": "list", "placement": "right" } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "{{rule_result}}", "expr": "sum by (rule_result) (kyverno_policy_results_total)" } ]
        },
        {
          "type": "timeseries", "title": "Kyverno — évaluations par mode (enforce vs audit)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 15, "stacking": { "mode": "normal" } } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "{{policy_validation_mode}}", "expr": "sum by (policy_validation_mode) (rate(kyverno_policy_results_total[5m]))" } ]
        },
        {
          "type": "timeseries", "title": "Kyverno — violations (fail) par policy",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "{{policy_name}}", "expr": "sum by (policy_name) (rate(kyverno_policy_results_total{rule_result=\"fail\"}[5m]))" } ]
        },
        {
          "type": "timeseries", "title": "Kyverno — requêtes d'admission (taux)",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "{{resource_kind}}", "expr": "sum by (resource_kind) (rate(kyverno_admission_requests_total[5m]))" } ]
        }
      ]
    }
