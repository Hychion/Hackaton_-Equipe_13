# Dashboard Grafana "Sauvegardes — Velero → OVH + Garage".
# Statut des 2 cibles de backup (off-site OVH + Garage in-cluster), fraîcheur
# du dernier backup, succès/échecs, taille/durée. Métriques Velero (port 8085,
# scrapées par velero-servicemonitor.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backup
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  backup.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "title": "Sauvegardes — Velero → OVH + Garage",
      "uid": "hackathon-backup",
      "tags": ["hackathon", "backup", "velero", "pra", "ovh", "garage"],
      "timezone": "browser",
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "query": "prometheus", "hide": 0, "current": {} }
        ]
      },
      "panels": [
        {
          "type": "stat", "title": "Cible OFF-SITE — OVH Object Storage",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" },
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "INDISPONIBLE", "color": "red" }, "1": { "text": "DISPONIBLE", "color": "green" } } } ],
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "velero_backup_location_status_gauge{backup_location_name=\"ovh\"}" } ]
        },
        {
          "type": "stat", "title": "Cible LOCALE — Garage (in-cluster)",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" },
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "INDISPONIBLE", "color": "red" }, "1": { "text": "DISPONIBLE", "color": "green" } } } ],
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "velero_backup_location_status_gauge{backup_location_name=\"garage\"}" } ]
        },
        {
          "type": "stat", "title": "Dernier backup",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "ÉCHEC", "color": "red" }, "1": { "text": "SUCCÈS", "color": "green" } } } ],
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "max(velero_backup_last_status)" } ]
        },
        {
          "type": "stat", "title": "Âge du dernier backup réussi",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": { "colorMode": "background", "graphMode": "none" },
          "fieldConfig": { "defaults": {
            "unit": "s", "decimals": 0,
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 3600 }, { "color": "red", "value": 86400 } ] }
          } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "time() - max(velero_backup_last_successful_timestamp)" } ]
        },
        {
          "type": "stat", "title": "Backups réussis (cumul)",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "green" } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(velero_backup_success_total)" } ]
        },
        {
          "type": "stat", "title": "Backups en échec (cumul)",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": {
            "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] }
          } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(velero_backup_failure_total) + sum(velero_backup_partial_failure_total)" } ]
        },
        {
          "type": "stat", "title": "Taille du dernier tarball",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "fixed", "fixedColor": "blue" } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "max(velero_backup_tarball_size_bytes)" } ]
        },
        {
          "type": "stat", "title": "Objets sauvegardés (dernier)",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "purple" } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "max(velero_backup_items_total)" } ]
        },
        {
          "type": "timeseries", "title": "Backups cumulés — réussis vs échoués",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "min": 0, "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 20 } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "réussis", "expr": "sum(velero_backup_success_total)" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "échoués", "expr": "sum(velero_backup_failure_total) + sum(velero_backup_partial_failure_total)" }
          ]
        },
        {
          "type": "timeseries", "title": "Durée cumulée des backups (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0, "custom": { "drawStyle": "line", "fillOpacity": 20 } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" }, "legendFormat": "durée totale", "expr": "sum(velero_backup_duration_seconds_sum)" }
          ]
        }
      ]
    }
