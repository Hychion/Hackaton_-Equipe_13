# Assemble le remediator. Le code Python (source de vérité, lisible dans le repo)
# est injecté dans une ConfigMap → pas besoin de builder/pousser une image
# (image python:3.12-slim + pip install au démarrage). 100% GitOps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: remediator
resources:
  - k8s/rbac.yaml
  - k8s/cronjob.yaml
configMapGenerator:
  - name: remediator-code
    files:
      - remediator.py
      - requirements.txt
generatorOptions:
  disableNameSuffixHash: true   # nom stable : la CronJob référence remediator-code
