# Environnement PRÉ-PROD (mono-cluster : namespace dédié). Reçoit le correctif
# avant la prod. Le validateur teste CE workload avant toute promotion.
# En vrai multi-cluster : ce même manifeste vit sur le cluster pré-prod.
apiVersion: v1
kind: Namespace
metadata:
  name: preprod
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-web
  namespace: preprod
  labels:
    app: vulnerable-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-web
  template:
    metadata:
      labels:
        app: vulnerable-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.25.4
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-web
  namespace: preprod
spec:
  selector:
    app: vulnerable-web
  ports:
    - port: 8080
      targetPort: 8080
