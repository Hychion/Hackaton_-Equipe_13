# MinIO — cible S3 des sauvegardes Velero (démontrable dans le cluster).
# En prod : pointer Velero vers OVH Object Storage ou un MinIO EXTERNE
# (même API S3 → on change juste l'endpoint, anti vendor lock-in).
# Credentials via le secret minio-creds (créé hors Git par scripts/bootstrap-backup.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: backup-store
  labels:
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: backup-store
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-creds     # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}          # démo : éphémère. Prod = PV ou stockage externe.
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: backup-store
spec:
  selector:
    app: minio
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Crée le bucket 'velero' au démarrage.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: backup-store
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          envFrom:
            - secretRef:
                name: minio-creds
          command:
            - sh
            - -c
            - |
              until mc alias set m http://minio.backup-store.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done
              mc mb -p m/velero || true
              echo "bucket velero prêt"
