# Keycloak (IdP OIDC) — SSO pour Argo CD et Grafana. Comble le gap IAM.
# Dev mode + import du realm au démarrage. LoadBalancer → IP publique
# (issuer OIDC joignable par le navigateur ET par les services in-cluster).
# NB : dev mode (H2 éphémère) = démo ; prod = Keycloak + PostgreSQL managé.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - name: KC_HTTP_ENABLED
              value: "true"
            # Hostname fixe = URLs cohérentes (corrige les consoles admin/account)
            - name: KC_HOSTNAME
              value: https://51.210.2.211
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # TLS servi directement par Keycloak (cert auto-signé pour l'IP du LB)
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/keycloak-tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/keycloak-tls/tls.key
          ports:
            - { name: http, containerPort: 8080 }
            - { name: https, containerPort: 8443 }
          readinessProbe:
            httpGet: { path: /realms/hackathon, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: tls, mountPath: /etc/keycloak-tls, readOnly: true }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: tls
          secret:
            secretName: keycloak-tls
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
    - name: https
      port: 443
      targetPort: 8443
