# Applications de "production" surveillées par la chaîne : un ERP et un site web.
# Images anciennes → matière pour Trivy (CVE) et Kyverno (config). Elles tournent
# en standalone (le conteneur reste up) pour être scannées.
# PSA en 'warn' : on signale les écarts sans bloquer (elles seront à remédier).
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# ========================= ERP (runtime Java / Tomcat) =========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp
  namespace: production
  labels:
    app: erp
    tier: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp
  template:
    metadata:
      labels:
        app: erp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: erp
          image: tomcat:9.0.30      # ancien → CVE Java/Tomcat connues
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: erp
  namespace: production
spec:
  selector:
    app: erp
  ports:
    - port: 8080
      targetPort: 8080
---
# ============================== Site web (CMS) ================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-web
  namespace: production
  labels:
    app: site-web
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-web
  template:
    metadata:
      labels:
        app: site-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: wordpress:6.1-apache   # ancien CMS → CVE PHP/Apache
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: site-web
  namespace: production
spec:
  selector:
    app: site-web
  ports:
    - port: 80
      targetPort: 80
